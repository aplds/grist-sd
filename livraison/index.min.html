<!--
  Page d'entrée de la **variante minifiée et regroupée** (NC-0004).

  Elle charge le JavaScript en un seul module et la feuille en un seul fichier,
  tous deux construits depuis `src/` par `livraison/build.mjs` et déposés à des
  adresses stables (voir `livraison/README.md`). Le dépôt source reste la
  référence : cette page n'est qu'une livraison.

  Pour reconstruire : `build.mjs` (`js`, `css`), puis déposer les deux fichiers
  et reporter leurs adresses ci-dessous.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://esm.sh https://user.uploads.dev; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://user.uploads.dev; img-src 'self' data: blob: https:; font-src 'self' data: https://cdn.jsdelivr.net https://user.uploads.dev; connect-src 'self' blob: data: https:; worker-src 'self' blob:; frame-src 'self' blob: data: https:;">
<script>
  /* Préparation du thème, comme dans la page du dépôt : le DSFR n'installe son
     gestionnaire que si `data-fr-scheme` ou `data-fr-theme` est déjà posé. */
  try {
    var stored = localStorage.getItem("scheme");
    var scheme = (stored === "dark" || stored === "light") ? stored : "system";
    var dark = scheme === "dark" || (scheme === "system"
      && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-fr-scheme", scheme);
    document.documentElement.setAttribute("data-fr-theme", dark ? "dark" : "light");
  } catch (e) { /* stockage indisponible */ }
</script>
