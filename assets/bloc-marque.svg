<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.500 0.000 27.417 24.083" width="1316" height="1156" role="img">
  <title>République Française — Liberté Égalité Fraternité</title>
  <!-- Source vectorielle du bloc-marque de l'État livré avec l'outil : c'est
       **ce fichier** que `bloc-marque.js` embarque (en `data:` URL, sous le nom
       `BLOC_MARQUE_DATA_URL`), et `bloc-marque.png` en est un rendu matriciel.

       Composition officielle de la charte graphique de l'État, telle que la
       rend le composant `fr-logo` du Système de Design de l'État :
         - en entrée, la Marianne — le drapeau tricolore et le profil blanc,
           repris du DSFR (`component/logo`) ;
         - l'intitulé « RÉPUBLIQUE FRANÇAISE » sur deux lignes, en Marianne
           Bold (capitales, 4,46 mm de corps, interlettrage -0,01 em) ;
         - en fin, la devise « Liberté Égalité Fraternité » sur trois lignes,
           reprise de l'illustration officielle du DSFR.

       Cotes, en millimètres (l'unité du dessin), celles de la charte : le bloc
       entier mesure 27,417 × 24,083 mm, la hauteur de capitale de l'intitulé
       vaut les 3/4 de celle du drapeau (3,1875 mm), et la devise occupe 42 %
       de la largeur de l'intitulé.

       Le drapeau reprend la construction du DSFR à l'identique : une boîte de
       11,6875 × 4,25 mm (2,75 pour 1) portant le tricolore — bleu #000091 et
       rouge #e1000f à parts égales —, et par-dessus le dessin de la Marianne
       (44 × 18, son rapport naturel), dessiné à 11,6875 mm de large, donc
       4,78 mm de haut, remonté de 0,265625 mm et **rogné** par la boîte. C'est
       exactement ce que fait le DSFR, où le tricolore est un dégradé CSS et la
       Marianne un dessin posé à `background-position: 0 -0.0625rem` dans une
       boîte de 1rem de haut.

       Les trois parties du dessin sont **vectorielles et autonomes** : la
       Marianne et la devise sont les dessins officiels du DSFR, et l'intitulé
       « RÉPUBLIQUE FRANÇAISE » est **converti en contours** — les glyphes de
       Marianne Bold (la police de l'État), à la taille et à l'interlettrage de
       la charte. Aucune police n'est donc nécessaire pour le rendre : le même
       fichier s'affiche à l'identique partout, y compris employé comme image
       (dans un `<img>`, les polices de la page ne sont pas accessibles), et il
       reste net à n'importe quelle taille. C'est ce dessin que l'outil emploie
       — en vectoriel à l'écran et à l'impression, pixellisé pour Word et
       OpenDocument (voir `bloc-marque.js`, et « Images » dans README.md). -->
  <defs><clipPath id="drapeau"><rect x="0" y="0" width="11.6875" height="4.25"/></clipPath></defs>
